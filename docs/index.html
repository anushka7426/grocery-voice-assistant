<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Grocery Voice Assistant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="start">
  <h1>Grocery Voice Assistant</h1>
  <p>Point your phone camera at a grocery pack. I will read out what it is.</p>
  <button id="go" class="big primary" autofocus>Start scanning</button>
</main>

<main id="main" hidden>
  <video id="video" playsinline muted aria-hidden="true"></video>
  <p id="status" role="status">Starting…</p>
  <button id="retry" class="big" hidden>Retry camera</button>

  <div class="grid">
    <button id="again" class="big primary">Scan next product</button>
    <button id="label" class="big">Read label text</button>
    <button id="repeat" class="big">Repeat</button>
    <button id="mic" class="big">Ask a question (voice)</button>
  </div>

  <div id="followups" class="grid" hidden>
    <button id="ing">Ingredients</button>
    <button id="all">Allergens</button>
    <button id="nut">Nutrition</button>
    <button id="veg">Vegetarian?</button>
  </div>

  <button id="teach" class="big" hidden>Teach this product</button>

  <details class="settings">
    <summary>Settings</summary>
    <div class="row">
      <button id="stop">Stop talking</button>
      <button id="light">Light on or off</button>
      <button id="slower">Speak slower</button>
      <button id="faster">Speak faster</button>
    </div>
    <label class="check"><input type="checkbox" id="sr"> Use my screen reader (TalkBack or VoiceOver) instead of the app voice</label>
  </details>

  <p id="transcript" aria-live="off"></p>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" id="teachForm">
    <h2 id="dlgTitle">Save this product</h2>
    <p>Barcode <span id="teachCode"></span></p>
    <label>Product name <input id="teachName" autocomplete="off"></label>
    <button type="button" id="dictate">Say the name</button>
    <label>Brand (optional) <input id="teachBrand" autocomplete="off"></label>
    <label>Pack size (optional) <input id="teachQty" autocomplete="off" placeholder="for example 70 g"></label>
    <div class="row">
      <button value="save" class="primary">Save</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
