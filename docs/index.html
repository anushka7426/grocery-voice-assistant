<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Grocery Voice Assistant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="start">
  <h1>Grocery Voice Assistant</h1>
  <p>Point your phone camera at a grocery pack. I will read out what it is.</p>
  <button id="go" class="big primary" autofocus>Start scanning</button>
</main>

<main id="main" hidden>
  <video id="video" playsinline muted aria-hidden="true"></video>
  <p id="status" role="status">Starting…</p>
  <button id="retry" class="big" hidden>Retry camera</button>

  <div class="grid">
    <button id="again" class="big primary">Scan next product</button>
    <button id="label" class="big">Read label text</button>
    <button id="repeat" class="big">Repeat</button>
    <button id="mic" class="big">Ask a question (voice)</button>
  </div>

  <div id="followups" class="grid" hidden>
    <button id="nut">Nutrition</button>
    <button id="veg">Vegetarian?</button>
  </div>

  <button id="save" class="big primary" hidden>Save</button>
  <button id="teach" class="big" hidden>Add details or correct the name</button>
  <button id="edit" class="big" hidden>Edit this product</button>
  <button id="photos" class="big" hidden>Take training photos of this product</button>

  <details class="settings">
    <summary>Settings</summary>
    <div class="row">
      <button id="stop">Stop talking</button>
      <button id="light">Light on or off</button>
      <button id="slower">Speak slower</button>
      <button id="faster">Speak faster</button>
    </div>
    <div class="row">
      <button id="addManual">Add a product by hand</button>
      <button id="mine">My saved products</button>
      <button id="otherPhotos">Take photos of other things (not a product)</button>
      <button id="galleryPhotos">Add photos from the gallery</button>
      <input type="file" id="galleryFile" accept="image/*" multiple hidden>
    </div>
    <label class="check"><input type="checkbox" id="sr"> Use my screen reader (TalkBack or VoiceOver) instead of the app voice</label>
  </details>

  <p id="transcript" aria-live="off"></p>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" id="teachForm">
    <h2 id="dlgTitle">Save this product</h2>
    <label>Barcode <input id="fCode" inputmode="numeric" autocomplete="off" readonly></label>
    <label>Product name (required)
      <span class="field"><input id="fName" autocomplete="off"><button type="button" class="say" data-for="fName">Say it</button></span></label>
    <label>Brand
      <span class="field"><input id="fBrand" autocomplete="off"><button type="button" class="say" data-for="fBrand">Say it</button></span></label>
    <label>Pack size
      <span class="field"><input id="fQty" autocomplete="off" placeholder="for example 70 g"><button type="button" class="say" data-for="fQty">Say it</button></span></label>
    <label>Price in rupees
      <span class="field"><input id="fMrp" inputmode="decimal" autocomplete="off" placeholder="for example 10"><button type="button" class="say" data-for="fMrp">Say it</button></span></label>
    <label>Vegetarian
      <select id="fDiet"><option value="unknown">Not sure</option><option value="vegetarian">Vegetarian (green dot)</option><option value="non-vegetarian">Non-vegetarian (brown dot)</option></select></label>
    <div class="row">
      <button value="save" class="primary">Save</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="mineDlg" aria-labelledby="mineTitle">
  <h2 id="mineTitle">My saved products</h2>
  <p id="mineCount"></p>
  <ul id="mineList"></ul>
  <div class="row">
    <button id="exportTrain">Export training data</button>
    <button id="exportBtn">Export a backup file</button>
    <button id="importBtn">Import a backup file</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button id="mineClose" class="primary">Close</button>
  </div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
